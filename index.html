<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT 2050</title><style>*{box-sizing:border-box}body{margin:0;background:#08111e;color:#e8f4ff;font:17px system-ui}header,main{max-width:1150px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #284458}button,a{cursor:pointer;color:#8ce9ff}button{background:#132c40;border:1px solid #39718c;border-radius:9px;padding:13px;font:inherit}button:hover{background:#24516a}h1{font-size:clamp(38px,7vw,82px);line-height:.95;margin:20px 0}h2{font-size:32px}small,.tag{color:#75d9ee;letter-spacing:2px}p{line-height:1.6;color:#b9cedf}.hero{background:radial-gradient(ellipse at 75% 40%,#194b65,transparent 65%),#101d2c;border:1px solid #34556c;border-radius:22px;padding:30px;display:grid;grid-template-columns:1fr 1fr;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;margin:24px 0}.tile{display:block;text-align:left;padding:20px;min-height:220px;background:linear-gradient(145deg,#152b40,#0b1725);border:1px solid #29485f;border-radius:16px;color:white}.tile:hover{border-color:#8ce9ff;transform:translateY(-2px)}.tile svg{width:100%;height:100px}.tile h3{margin:10px 0}.panel{padding:22px;background:#112235;border:1px solid #29485f;border-radius:15px}.secret{border-color:#a95748;color:#ffac91}.hidden{display:none}input{background:#08111e;color:white;padding:12px;border:1px solid #55788b;border-radius:8px;font:inherit;max-width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #29485f}svg{max-width:100%}.art{width:100%;height:auto}.muted{color:#91aabd}footer{text-align:center;padding:30px;color:#91aabd}@media(max-width:650px){.hero{grid-template-columns:1fr}header,main{padding:15px}}.carphoto{width:100%;display:block;background:white;border-radius:10px;object-fit:contain}.tile .carphoto{aspect-ratio:16/9;margin-bottom:14px}.sketch{margin:20px 0}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.sketch input[type=range]{width:100%;accent-color:#75d9ee}.sketch .carphoto{max-height:65vh}.carphoto:fullscreen{object-fit:contain;background:white}
body{background:radial-gradient(ellipse at top,#18324a,#070e19 65%)}header,main{max-width:1320px}.hero{position:relative;overflow:hidden;min-height:390px;display:block;padding:45px;background:#101d2c}.hero>div{position:relative;z-index:1;max-width:55%;text-shadow:0 2px 12px #000}.hero>.visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72;mask-image:linear-gradient(to right,transparent 12%,#000 75%)}.visual{width:100%;display:block;object-fit:cover;border-radius:12px;aspect-ratio:16/9}.tile{padding:0 0 20px;overflow:hidden;min-height:250px;background:#112337}.tile>.visual{border-radius:0;aspect-ratio:16/10;margin-bottom:15px}.tile small,.tile h3,.tile span{margin-left:18px;margin-right:18px;display:block}.tile .carphoto{margin:0 0 15px;border-radius:0}.panel .visual{margin-bottom:15px}.panel.secret .visual{max-height:280px}.panel:has(#idea){background:#162d40}main>.visual{max-height:520px;object-fit:contain;background:#fff}.grid{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}.tile.secret{background:#281a24}.tile:hover{box-shadow:0 0 22px #46b9df33}.hero h1{color:white}.hero p{color:white}@media(max-width:650px){.hero{padding:24px;min-height:350px}.hero>div{max-width:100%}.hero>.visual{opacity:.38;mask-image:none}.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.tile{min-height:200px}.tile small{font-size:10px}.tile h3{font-size:16px}}
</style><header><b>◈ PROJECT / 2050</b><button onclick="go('home')">⌂ Home</button></header><main id="app"></main><footer>ETLV • STI2D • DESIGN & ENGINEERING LAB</footer><script>
const app=document.getElementById('app');let unlocked=sessionStorage.getItem('lab')==='yes';
function photo(name,alt=''){return `<img class="visual" src="visual/${name}.webp" alt="${alt||name}">`}
function art(kind='car'){return photo(({car:'renault',draw:'sketch',tech:'mercedes',voice:'bmw',secret:'moon',fly:'flight',space:'moon',water:'water'})[kind]||kind)}
const tiles=[['mission','Your mission','The design brief','car'],['vocab','Vocabulary','Explore and listen','tech'],['draw','How to draw a car','Sketching workshop','draw'],['inspire','Get inspired','Explore design shapes','car'],['tech','Future technologies','Engineering toolbox','tech'],['oral','Prepare your presentation','Speak like an engineer','voice'],['lab','Secret innovation lab','Restricted access','secret']];
function tile(t){return `<button class="tile ${t[0]==='lab'?'secret':''}" onclick="go('${t[0]}')">${photo(({mission:'renault',vocab:'vocab',draw:'sketch',inspire:'mercedes',tech:'green',oral:'bmw',lab:'vault'})[t[0]],t[1])}<small>${t[0]==='lab'?(unlocked?'ACCESS GRANTED':'🔒 CLASSIFIED'):'PROJECT 2050'}</small><h3>${t[1]}</h3><span class="muted">${t[2]}</span></button>`}
function page(title,sub,body){app.innerHTML=`<small>PROJECT 2050 / RESOURCE CENTER</small><h2>${title}</h2><p>${sub}</p>${body}<button onclick="go('home')">← Back to home</button>`;window.scrollTo(0,0)}
const words=[['Bodywork','Carrosserie'],['Wheel','Roue'],['Tyre','Pneu'],['Windscreen','Pare-brise'],['Headlights','Phares'],['Steering wheel','Volant'],['Battery','Batterie'],['Electric motor','Moteur électrique'],['Driving range','Autonomie'],['Thrust','Poussée'],['Lift','Portance'],['Propeller','Hélice'],['Sensor','Capteur'],['Fuel cell','Pile à combustible'],['Safety','Sécurité'],['Recycled materials','Matériaux recyclés'],['To fly','Voler'],['To float','Flotter'],['To transform','Se transformer'],['To steer','Diriger']];function speak(w){let u=new SpeechSynthesisUtterance(w);u.lang='en-GB';speechSynthesis.speak(u)}
function go(p){location.hash=p;render(p)}function render(p){if(p==='home'){app.innerHTML=`<section class="hero"><div><small>ETLV / DESIGN CHALLENGE</small><h1>PROJECT<br>2050</h1><h2>Imagine the impossible.</h2><p>Design the car of the future. Think like an engineer. Present your invention in English.</p><small>120 MINUTES • TEAMWORK • ORAL PRESENTATION</small></div>${photo('mercedes','Futuristic concept car')}</section><div class="grid">${tiles.map(tile).join('')}</div>`;return}if(p==='mission')page('Your mission','You are an automotive design team.',`<div class="grid"><div class="panel">${art('draw')}<h3>Design</h3><p>Invent a name. Draw your vehicle on paper and label its main features in English.</p></div><div class="panel">${art('tech')}<h3>Explain</h3><p>Describe its purpose, energy source, movement, control and safety. Invent at least one original feature.</p></div><div class="panel">${art('voice')}<h3>Present</h3><p>Prepare a 3–5 minute presentation. Every team member must speak.</p></div></div>`);if(p==='vocab')page('Vocabulary','Click a speaker to hear the English pronunciation.',`${photo('vocab','English car vocabulary')}<div class="grid">${words.map(w=>`<div class="panel"><b>${w[0]}</b> <button onclick="speak('${w[0]}')">🔊</button><p>${w[1]}</p></div>`).join('')}</div>`);if(p==='draw')drawingHome();if(p.startsWith('sketch-'))sketchPage(p.slice(7));if(p==='inspire')page('Get inspired','Explore shapes, proportions and design language. Do not copy a model.',`<div class="grid">${[['Renault concept','renault'],['Mercedes Vision AVTR','mercedes'],['BMW concept','bmw']].map(x=>`<div class="panel">${photo(x[1])}<h3>${x[0]}</h3><p>How could you change this design to meet a new need?</p></div>`).join('')}</div>`);if(p==='tech')page('Future technologies','Use these questions as starting points, not ready-made answers.',`<div class="grid">${[['Energy','Where does energy come from?'],['Movement','How is energy converted into motion?'],['Control','How does the vehicle understand its surroundings?'],['Safety','How are passengers protected?'],['Environment','How can you reduce environmental impact?'],['Materials','How can the structure adapt to its purpose?']].map(x=>`<div class="panel">${photo(({Energy:'green',Movement:'mercedes',Control:'bmw',Safety:'renault',Environment:'green',Materials:'house'})[x[0]])}<h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`);if(p==='oral')page('Prepare your presentation','Explain your invention, rather than reading a list of features.',`<div class="panel">${photo('bmw','Concept vehicle')} ${['Our vehicle is called…','It is designed for…','It is powered by…','It moves by…','Our original invention is…','This system works by…','The main advantage is…','The biggest technical challenge is…'].map(x=>`<p>${x} <button onclick="speak('${x}')">🔊</button></p>`).join('')}</div>`);if(p==='lab'){if(!unlocked)page('Restricted access','Teacher authorization required.',`<div class="panel secret">${photo('vault')}<h2>TOP SECRET</h2><input id="pin" type="password" placeholder="Security code" onkeydown="if(event.key==='Enter')unlock()"> <button onclick="unlock()">Unlock laboratory</button><p id="err"></p></div>`);else page('Secret innovation laboratory','Forget everything you know about cars.',`<div class="grid">${[['fly','What if cars could fly?'],['water','What if cars could travel underwater?'],['space','What if cars could travel in space?'],['walker','What if cars had no wheels?'],['green','What if cars could clean the planet?'],['house','What if cars could become homes?']].map(x=>`<div class="panel">${art(x[0])}<h3>${x[1]}</h3></div>`).join('')}</div><div class="panel"><h2>Innovation generator</h2><div id="idea"></div><button onclick="generate()">⟳ Generate a new concept</button></div><p>What problem does it solve? How does it move? How does it protect its passengers?</p><button onclick="unlocked=false;sessionStorage.removeItem('lab');go('lab')">Lock laboratory</button>`),generate()}}
const models=[['dodge-challenger','Dodge Challenger',20,'Muscle car'],['ford-raptor','Ford Raptor',23,'Pick-up'],['new-beetle','New Beetle',23,'Compact car'],['porsche-918','Porsche 918',14,'Sports car']];
function picture(m,n){return 'drawing/'+m[0]+'/'+String(n).padStart(2,'0')+'.webp'}
function drawingHome(){page('How to draw a car','Choose a model. Follow the steps at your own pace, then invent your own vehicle.',`<div class="grid">${models.map(m=>`<button class="tile" onclick="go('sketch-${m[0]}')"><img class="carphoto" src="${picture(m,m[2])}" alt="${m[1]}"><small>${m[3]} • ${m[2]} slides</small><h3>${m[1]}</h3>Start drawing →</button>`).join('')}</div><h3>More video resources</h3><p><a href="https://www.youtube.com/results?search_query=how+to+draw+a+car+side+view+step+by+step" target="_blank">Find side-view drawing tutorials on YouTube ↗</a></p><p><a href="https://www.youtube.com/results?search_query=automotive+design+car+sketch+perspective+tutorial" target="_blank">Find perspective drawing tutorials ↗</a></p>`)}
let currentModel,step=1;
function sketchPage(id){currentModel=models.find(m=>m[0]===id);if(!currentModel){drawingHome();return}step=1;page(currentModel[1],'Observe the lines and build your sketch step by step.',`<button onclick="go('draw')">← All drawing tutorials</button><div class="panel sketch"><div class="controls"><button onclick="moveStep(-1)">← Previous</button><b id="counter"></b><button onclick="moveStep(1)">Next →</button></div><img id="drawingImage" class="carphoto" alt="Drawing step"><input id="stepRange" type="range" min="1" max="${currentModel[2]}" value="1" oninput="step=Number(this.value);updateStep()"><div class="controls"><button onclick="step=1;updateStep()">Restart</button><button onclick="step=currentModel[2];updateStep()">Final result</button><button onclick="document.getElementById('drawingImage').requestFullscreen?.()">Full screen</button></div></div>`);updateStep()}
function moveStep(delta){step=Math.max(1,Math.min(currentModel[2],step+delta));updateStep()}
function updateStep(){document.getElementById('drawingImage').src=picture(currentModel,step);document.getElementById('counter').textContent=step+' / '+currentModel[2];document.getElementById('stepRange').value=step}
document.addEventListener('keydown',e=>{if(location.hash.startsWith('#sketch-')&&e.target.tagName!=='INPUT'){if(e.key==='ArrowRight')moveStep(1);if(e.key==='ArrowLeft')moveStep(-1)}});
function unlock(){if(document.getElementById('pin').value==='2050'){unlocked=true;sessionStorage.setItem('lab','yes');render('lab')}else document.getElementById('err').textContent='ACCESS DENIED — Try again.'}function generate(){let groups=[['On Mars','Underwater','Above the clouds','In a flooded city','On the Moon'],['Change shape','Repair itself','Become a house','Walk instead of rolling','Clean the environment'],['No wheels','No roads','No driver','Six passengers','Zero waste']];document.getElementById('idea').innerHTML='<div class="grid">'+groups.map((g,i)=>`<div class="panel"><small>${['WHERE?','WHAT?','HOW?'][i]}</small><h3>${g[Math.floor(Math.random()*g.length)]}</h3></div>`).join('')+'</div>'}window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'home'));render(location.hash.slice(1)||'home');</script></html>
